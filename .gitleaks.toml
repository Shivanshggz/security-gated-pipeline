# Gitleaks configuration
# https://github.com/gitleaks/gitleaks

title = "Security-Gated Pipeline Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
    '''tests/.*''',
    '''docs/.*''',
    '''.*\.md$''',
    '''.*\.lock$''',
]

regexes = [
    '''AKIAIOSFODNN7EXAMPLE''',
    '''wJalrXUtnFEMI/K7MDENG''',
]